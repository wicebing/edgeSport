name: Deploy EDGE SPORT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workflow dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate weekly content
        run: npm run validate

      - name: Stage public site
        run: |
          mkdir -p _site/content _site/assets
          cp index.html styles.css app.js radar.js weekly-reports.js podcasts.js _site/
          cp content/issues.json content/research-radar.json content/source-registry.json content/weekly-reports.json content/podcasts.json content/knowledge-index.json _site/content/
          cp assets/yabilab-logo.png _site/assets/
          cp -R assets/podcasts _site/assets/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate-and-stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
